[ainode_test]
# ai-dfir-node-test, Proxmox VMID 960 on pve (192.168.10.200), VLAN 20 -- a
# real qm-managed VM, not a disposable raw-qemu process. IP is DHCP-assigned;
# re-check via the UniFi Integration API (by MAC, see qm config 960) if it
# ever changes after a reboot.
#
# Connects as `provision`, NOT `ainode`: the audit_logging role forces the
# ainode user's SSH sessions through tlog-rec-session, which always launches
# an interactive shell and ignores SSH_ORIGINAL_COMMAND (Scribery/tlog#227) --
# so Ansible can never run module code as ainode once that role has deployed.
# `provision` is a separate, unrecorded automation account created by the
# same kickstart (ks.cfg.tmpl) for exactly this purpose.
ainode-test-vm ansible_host=192.168.20.17 ansible_user=provision ansible_ssh_private_key_file=~/.ssh/ai_dfir_node_test_ed25519 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[ainode_test:vars]
ansible_python_interpreter=/usr/bin/python3
