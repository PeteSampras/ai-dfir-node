[ainode_test]
# ai-dfir-node-test, Proxmox VMID 960 on pve (192.168.10.200), VLAN 20 -- a
# real qm-managed VM, not a disposable raw-qemu process. IP is DHCP-assigned;
# re-check via the UniFi Integration API (by MAC, see qm config 960) if it
# ever changes after a reboot.
ainode-test-vm ansible_host=192.168.20.17 ansible_user=ainode ansible_ssh_private_key_file=~/.ssh/ai_dfir_node_test_ed25519 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[ainode_test:vars]
ansible_python_interpreter=/usr/bin/python3
