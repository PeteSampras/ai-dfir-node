---
- name: Install podman and related tools
  ansible.builtin.dnf:
    name:
      - podman
      - podman-plugins
      - jq
    state: present

- name: Ensure quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

# Explicit, BEFORE any of its children: ansible.builtin.file auto-creates
# missing parents, but does so as root:root mode 0750 -- world/group-
# untraversable to anyone outside the root group. That silently blocked the
# ainode user from ever reaching audit_root (a child of this same parent)
# regardless of audit_root's own ownership, since traversal requires execute
# permission on every path component, not just the leaf directory.
- name: Ensure /srv/ainode parent exists and is traversable by non-root users
  ansible.builtin.file:
    path: /srv/ainode
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure scratch/backup roots exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ scratch_root }}"
    - "{{ backup_root }}"

# A pure traversable umbrella, not owned by any one service: its children
# have different real owners (mcp-calls is root, since podman/containers run
# rootful; sessions is the dedicated tlog system user, since tlog-rec-session
# is setuid/setgid to it -- see audit_logging role). 0755 lets every one of
# them traverse through here regardless of group membership, while the
# actual content stays protected by each child's own tighter mode.
- name: Ensure audit root exists (traversable umbrella; each child directory owns its own tighter permissions)
  ansible.builtin.file:
    path: "{{ audit_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable podman.socket
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started

- name: Reload systemd so quadlet units generate on next apply
  ansible.builtin.systemd:
    daemon_reload: true
