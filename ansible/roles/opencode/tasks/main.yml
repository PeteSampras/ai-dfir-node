---
- name: Install opencode as the ainode user (latest by default, build-time internet only)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://opencode.ai/install | bash{{ ' -s -- --version ' + opencode_version if opencode_version | default('') | length > 0 else '' }}
  args:
    creates: /home/ainode/.opencode/bin/opencode
  become: true
  become_user: ainode
  environment:
    HOME: /home/ainode

- name: Install python3.11 (Rocky 9's default python3 is 3.9 -- both MCP servers declare requires-python >=3.11)
  ansible.builtin.dnf:
    name:
      - python3.11
      - python3.11-pip
    state: present

- name: Create venv dirs for stdio-invoked MCP servers
  ansible.builtin.file:
    path: "/opt/ainode/venvs/{{ item }}"
    state: directory
    mode: "0755"
  loop: [attack-mcp, arkime-mcp]

- name: Install attack-mcp into its own venv for opencode stdio use
  ansible.builtin.pip:
    name: "/opt/ainode/build/attack-mcp"
    virtualenv: /opt/ainode/venvs/attack-mcp
    virtualenv_command: python3.11 -m venv

- name: Install arkime-mcp into its own venv (only when configured)
  ansible.builtin.pip:
    name: "/opt/ainode/build/arkime-mcp"
    virtualenv: /opt/ainode/venvs/arkime-mcp
    virtualenv_command: python3.11 -m venv
  when: arkime_configured

- name: Ensure opencode config dir exists for the ainode user
  ansible.builtin.file:
    path: /home/ainode/.config/opencode
    state: directory
    owner: ainode
    group: ainode
    mode: "0755"

- name: Write opencode config
  ansible.builtin.template:
    src: opencode-config.json.j2
    dest: /home/ainode/.config/opencode/opencode.json
    owner: ainode
    group: ainode
    mode: "0644"
