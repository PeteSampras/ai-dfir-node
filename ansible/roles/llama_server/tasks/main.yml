---
- name: Llama-server (GPU only)
  when: gpu_available
  block:
    - name: Ensure model directory exists
      ansible.builtin.file:
        path: /opt/ainode/models
        state: directory
        mode: "0755"

    - name: Check whether the model file is already present
      ansible.builtin.stat:
        path: "/opt/ainode/models/{{ model_file }}"
      register: model_stat

    - name: Copy the model from an already-downloaded local file (control node -> target, no re-download)
      ansible.builtin.copy:
        src: "{{ model_local_path }}"
        dest: "/opt/ainode/models/{{ model_file }}"
        mode: "0644"
      when: not model_stat.stat.exists and model_local_path is defined and model_local_path | length > 0

    - name: Fetch the model from Hugging Face (build/first-provision time only, needs target internet access)
      ansible.builtin.script: >
        {{ playbook_dir }}/../scripts/fetch-model.sh {{ model_repo }} {{ model_file }} /opt/ainode/models
      when: not model_stat.stat.exists and (model_local_path is not defined or model_local_path | length == 0)

    - name: Pull llama.cpp CUDA server image
      containers.podman.podman_image:
        name: ghcr.io/ggml-org/llama.cpp:server-cuda
        pull: true

    - name: Deploy llama-server quadlet
      ansible.builtin.template:
        src: llama-server.container.j2
        dest: /etc/containers/systemd/llama-server.container
        mode: "0644"
      notify: Reload systemd and restart llama-server

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # Explicit, not handler-only -- same reasoning as mcp_servers/open_webui:
    # notify: handlers only fire if the play reaches its end-of-play flush
    # without a fatal error anywhere first, and this role's own handler was
    # the one that DID hard-fail the whole play on every provision before
    # ConditionPathExists was added. Safe on a GPU-less build VM: the
    # ConditionPathExists=/dev/nvidia0 gate on the unit itself still makes
    # this a clean skip (not a failure) there; this only guarantees a real
    # start on real hardware, independent of handler-flush timing.
    - name: Ensure llama-server is enabled and started (skips cleanly without a GPU, see ConditionPathExists)
      ansible.builtin.systemd:
        name: llama-server.service
        enabled: true
        state: started

- name: Skip note when GPU not available
  ansible.builtin.debug:
    msg: "gpu_available=false — llama_server role skipped. Model serving cannot be verified on this box; see docs/runbooks/manual-validation.md."
  when: not gpu_available
