---
# Deliberately its OWN subdirectory, not the shared audit_root -- container
# bind mounts use :Z (SELinux private relabel), which would otherwise
# relabel the whole audit tree to container_file_t and block the host-side
# tlog-rec-session process (a completely different SELinux domain) from
# writing session recordings into audit_root/sessions.
- name: Ensure the MCP tool-call audit subdirectory exists (isolated from :Z-relabeled container mounts)
  ansible.builtin.file:
    path: "{{ audit_root }}/mcp-calls"
    state: directory
    mode: "0750"

- name: Ensure attack-mcp build context directory exists (copying a single file, unlike a directory, does not auto-create its parent)
  ansible.builtin.file:
    path: /opt/ainode/build/attack-mcp
    state: directory
    mode: "0755"

# Only the paths the Containerfile actually COPYs -- not the whole directory
# (which may also contain a local .venv/tests/__pycache__ from development;
# ansible.builtin.copy has no directory-tree exclude filter, and a stray
# multi-hundred-file venv turns this into a very slow per-file SFTP transfer).
- name: Copy attack-mcp build context (only the paths the Containerfile needs)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mcp-servers/attack-mcp/{{ item }}"
    dest: "/opt/ainode/build/attack-mcp/{{ item }}"
    mode: "0644"
  loop:
    - Containerfile
    - pyproject.toml
    - attack_mcp/
    - data/

- name: Verify the ATT&CK dataset is present and non-trivial before building
  ansible.builtin.stat:
    path: /opt/ainode/build/attack-mcp/data/enterprise-attack.json
  register: attack_data_stat

- name: Fail loudly if ATT&CK data was never pinned
  ansible.builtin.fail:
    msg: >
      mcp-servers/attack-mcp/data/enterprise-attack.json is missing or empty.
      Run scripts/pin-attack-data.sh (needs internet) before deploying, or the
      attack-mcp container will build with no ATT&CK data.
  # Threshold set below the committed test fixture's own size (890 bytes,
  # tests/fixtures/mini-attack.json -- a deliberately minimal 2-technique
  # bundle for unit tests) so a real test-mode deploy isn't rejected by its
  # own guard. The real pinned dataset (scripts/pin-attack-data.sh) is tens
  # of MB; this only needs to catch a genuinely empty/zero-byte file.
  when: not attack_data_stat.stat.exists or attack_data_stat.stat.size < 500

# force: true because podman_image's own idempotency check is "does an image
# with this name:tag already exist locally", not "has the build context
# changed" -- found live 2026-08-20 after a real source fix (attack_mcp/
# copy showed changed, but the image build itself showed ok, so the fix
# never actually landed in the running container). Podman's own build-layer
# cache still makes this cheap when nothing changed.
- name: Build attack-mcp image
  containers.podman.podman_image:
    name: localhost/attack-mcp:latest
    path: /opt/ainode/build/attack-mcp
    force: true
    build:
      format: docker

- name: Deploy attack-mcp quadlet
  ansible.builtin.template:
    src: attack-mcp.container.j2
    dest: /etc/containers/systemd/attack-mcp.container
    mode: "0644"
  notify: Reload systemd and restart attack-mcp

- name: Arkime MCP (only when arkime_configured)
  when: arkime_configured
  block:
    - name: Ensure arkime-mcp build context directory exists (copying a single file, unlike a directory, does not auto-create its parent)
      ansible.builtin.file:
        path: /opt/ainode/build/arkime-mcp
        state: directory
        mode: "0755"

    - name: Copy arkime-mcp build context (only the paths the Containerfile needs)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../mcp-servers/arkime-mcp/{{ item }}"
        dest: "/opt/ainode/build/arkime-mcp/{{ item }}"
        mode: "0644"
      loop:
        - Containerfile
        - pyproject.toml
        - arkime_mcp/

    - name: Build arkime-mcp image
      containers.podman.podman_image:
        name: localhost/arkime-mcp:latest
        path: /opt/ainode/build/arkime-mcp
        force: true
        build:
          format: docker

    - name: Write arkime-mcp env file (credentials, never in git)
      ansible.builtin.template:
        src: arkime-mcp.env.j2
        dest: /etc/ainode/arkime-mcp.env
        mode: "0600"

    - name: Deploy arkime-mcp quadlet
      ansible.builtin.template:
        src: arkime-mcp.container.j2
        dest: /etc/containers/systemd/arkime-mcp.container
        mode: "0644"
      notify: Reload systemd and restart arkime-mcp

- name: Elasticsearch MCP (only when elasticsearch_configured)
  when: elasticsearch_configured
  block:
    - name: Copy elasticsearch-mcp build context
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../mcp-servers/elasticsearch-mcp/"
        dest: /opt/ainode/build/elasticsearch-mcp/
        mode: "0644"

    - name: Build elasticsearch-mcp image
      containers.podman.podman_image:
        name: localhost/elasticsearch-mcp:latest
        path: /opt/ainode/build/elasticsearch-mcp
        force: true
        build:
          format: docker

    - name: Write elasticsearch-mcp env file (credentials, never in git)
      ansible.builtin.template:
        src: elasticsearch-mcp.env.j2
        dest: /etc/ainode/elasticsearch-mcp.env
        mode: "0600"

    - name: Deploy elasticsearch-mcp quadlet
      ansible.builtin.template:
        src: elasticsearch-mcp.container.j2
        dest: /etc/containers/systemd/elasticsearch-mcp.container
        mode: "0644"
      notify: Reload systemd and restart elasticsearch-mcp

- name: Reload systemd now so this run's verify step sees the new units
  ansible.builtin.systemd:
    daemon_reload: true

# Explicit, not handler-only: notify: handlers only fire if their triggering
# task reports changed AND the play reaches its end-of-play handler flush
# without a fatal error anywhere first. Found live: a later, unrelated
# fatal error in the SAME play (llama_server) aborted the host before
# handlers flushed, so these quadlets were deployed but never actually
# started -- and every subsequent run saw the files as unchanged and never
# re-notified, so the gap was invisible on every re-run too. Explicit
# enabled+started tasks guarantee these are running regardless of what
# happens elsewhere in the play, the same way nginx is already handled in
# the open_webui role.
- name: Ensure attack-mcp is enabled and started
  ansible.builtin.systemd:
    name: attack-mcp.service
    enabled: true
    state: started

- name: Ensure arkime-mcp is enabled and started
  ansible.builtin.systemd:
    name: arkime-mcp.service
    enabled: true
    state: started
  when: arkime_configured

- name: Ensure elasticsearch-mcp is enabled and started
  ansible.builtin.systemd:
    name: elasticsearch-mcp.service
    enabled: true
    state: started
  when: elasticsearch_configured
