---
- name: Install auditd and tlog
  ansible.builtin.dnf:
    name: [audit, tlog]
    state: present

- name: Deploy auditd rules
  ansible.builtin.template:
    src: ainode.rules.j2
    dest: /etc/audit/rules.d/ainode.rules
    mode: "0640"
  notify: Reload auditd rules

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# tlog-rec-session is setuid+setgid to the dedicated 'tlog' system user
# (rwsr-sr-x tlog tlog, by RPM packaging design -- so the recorded user can't
# tamper with or delete their own session log). It runs as tlog, never as
# ainode and never as root, so the directory it writes into must be owned by
# tlog:tlog, not ainode:ainode. (The path down to here must still be
# traversable by tlog too -- see the /srv/ainode parent-directory fix in the
# podman_base role.)
- name: Ensure tlog session directory exists (owned by tlog -- tlog-rec-session is setuid/setgid to the tlog system user, not the authenticating user)
  ansible.builtin.file:
    path: "{{ audit_root }}/sessions"
    state: directory
    owner: tlog
    group: tlog
    mode: "0770"

- name: Deploy tlog config
  ansible.builtin.template:
    src: tlog.conf.j2
    dest: /etc/tlog/tlog-rec-session.conf
    mode: "0644"

- name: Force interactive SSH sessions for the ainode user through tlog-rec-session
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK - ainode tlog"
    block: |
      Match User ainode
        ForceCommand /usr/bin/tlog-rec-session
  notify: Restart sshd for ainode tlog

- name: Deploy audit tree logrotate config
  ansible.builtin.template:
    src: ainode-logrotate.j2
    dest: /etc/logrotate.d/ainode
    mode: "0644"
