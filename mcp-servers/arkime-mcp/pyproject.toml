[project]
name = "arkime-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0,<2.0.0", "httpx>=0.27"]

[project.scripts]
arkime-mcp = "arkime_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
