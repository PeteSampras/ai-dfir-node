# Minimal bring-up stack -- basics only: web UI, the model (llama.cpp), the Elasticsearch
# MCP tool, and a submit/poll job queue in front of the model.
#
# For when the OVA path isn't available (e.g. ESXi import blocked) and Docker + GPU
# passthrough are already working directly on the host. Not a replacement for the full
# ansible-provisioned node (docs/CONFIGURATION.md) -- no auditd/tlog accountability logging,
# no firewalld/SELinux hardening, no Arkime/ATT&CK MCP, no opencode CLI. This is the fast
# path to a working web UI + model + one MCP tool + a queue, nothing else.
#
# Usage:
#   1. cp .env.minimal.example .env.minimal
#   2. Edit .env.minimal: point MODEL_FILE at a GGUF you've placed in ./models/,
#      set ES_URL/ES_API_KEY, and set ES_SSL_SKIP_VERIFY=true if Elastic uses a self-signed
#      cert (or drop the "elasticsearch" entry from docker/mcpo-config.json if you don't
#      have Elastic reachable from here yet -- see the note below).
#   3. docker compose -f docker-compose.minimal.yml --env-file .env.minimal up -d --build
#   4. Open WebUI: http://<this-host>:3000  |  Queue API: http://<this-host>:8090/docs
#
# GETTING A MODEL FILE HERE: llama.cpp (used below) needs a local GGUF. Two options --
# neither needs Unsloth's own tooling, which is unnecessary for just running the model:
#   (a) Already have the GGUF from ai-workstation? Copy/scp it into ./models/.
#   (b) No file handy? Ollama is the fastest path to *something* running today -- pull
#       any GGUF-based model by name (`ollama pull <model>`) and it handles fetch/serving
#       itself. Swapping llama-server below for Ollama is a straight swap: same
#       OpenAI-compatible /v1 API, same port convention -- change the image to
#       `ollama/ollama:latest`, drop --model/--n-gpu-layers/--ctx-size (Ollama's own CLI/
#       API takes it from there), and everything downstream (queue, Open WebUI) needs no
#       changes since they only talk to the OpenAI-compatible endpoint, never llama.cpp
#       specifically.

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size ${MODEL_CONTEXT_SIZE:-32768}
    volumes:
      - ./models:/models:Z
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  llm-queue:
    build: ./services/llm-queue
    environment:
      LLAMA_BASE_URL: http://llama-server:8080/v1
      LLAMA_MODEL: ${MODEL_FILE}
      LLAMA_TIMEOUT_S: "900"
      QUEUE_DB_PATH: /data/queue.db
    volumes:
      - llm-queue-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - llama-server
    restart: unless-stopped

  # The Elasticsearch MCP server runs INSIDE mcpo, as a stdio subprocess -- it is not a
  # service of its own. See docker/mcpo/Containerfile for why: the package implements only
  # stdio, so as a standalone container it exits 0 on stdin EOF in a silent crash-loop.
  # To run without Elastic, drop the "elasticsearch" entry from docker/mcpo-config.json;
  # everything else runs fine without it.
  mcpo:
    build:
      context: ./docker/mcpo
      dockerfile: Containerfile
    command: ["--config", "/config.json", "--port", "8000"]
    # mcpo merges its own environment into every server it spawns
    # (env={**os.environ, **cfg["env"]}), so these reach the stdio child without
    # ES_API_KEY ever being written into the tracked config file.
    # ES_SSL_SKIP_VERIFY is REQUIRED against Security Onion's self-signed cert: without it
    # the first Elastic call fails with "unable to verify the first certificate". For
    # production prefer ES_CA_CERT -- that cert carries a correct SAN for the ES host, so
    # pinning it validates properly instead of disabling verification against a SOC cluster.
    environment:
      ES_URL: ${ES_URL}
      ES_API_KEY: ${ES_API_KEY}
      ES_SSL_SKIP_VERIFY: ${ES_SSL_SKIP_VERIFY:-false}
    volumes:
      - ./docker/mcpo-config.json:/config.json:ro
    # Bound to loopback so scripts/dfir-hunt.py can reach the tools from the host.
    # mcpo runs without --api-key, so this must never be exposed beyond 127.0.0.1.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # stdio -> streamable-HTTP bridge, so llama.cpp's built-in WebUI (which speaks MCP,
  # not OpenAPI) has something to connect to. Internal only, deliberately: browsers must
  # go through mcp-audit-proxy:8001/mcp, which parses the JSON-RPC and records every
  # tools/call. Publishing this port would hand a browser an unaudited path to the SOC.
  mcp-bridge:
    build:
      context: ./services/mcp-bridge
      dockerfile: Containerfile
    environment:
      ES_URL: ${ES_URL}
      ES_API_KEY: ${ES_API_KEY}
      ES_SSL_SKIP_VERIFY: ${ES_SSL_SKIP_VERIFY:-false}
    expose:
      - "8080"
    restart: unless-stopped

  # Audit-logging proxy in front of mcpo. Design spec section 5 requires every MCP
  # invocation to be logged (query text, target, result digest, timestamp) and nothing
  # else implements it: auditd sees execve, tlog sees terminal I/O, Open WebUI's chat DB
  # sees prompts -- none of them see a tool call. Point Open WebUI's tool server and
  # scripts/dfir-hunt.py at THIS (8001), not mcpo directly, or calls go unrecorded.
  # Shares the queue's sqlite volume: the trail lands in queue.db, table ai_audit.
  mcp-audit-proxy:
    build:
      context: ./services/mcp-audit-proxy
      dockerfile: Dockerfile
    environment:
      MCPO_BASE_URL: http://mcpo:8000
      MCP_BRIDGE_URL: http://mcp-bridge:8080/mcp
      AUDIT_DB_PATH: /data/queue.db
    volumes:
      - llm-queue-data:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - mcpo
      - mcp-bridge
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      OPENAI_API_BASE_URL: http://llama-server:8080/v1
      OPENAI_API_KEY: unused
      # Registers the audited tool server so a fresh clone needs no GUI clicking.
      # CAVEAT: this is a PersistentConfig. With ENABLE_PERSISTENT_CONFIG=True (the
      # default) it seeds the database on FIRST boot only; afterwards the stored value
      # wins and edits here are ignored. For an instance that has already started, use
      # `make seed`, which writes through the API instead.
      TOOL_SERVER_CONNECTIONS: '[{"url":"http://mcp-audit-proxy:8001/elasticsearch","path":"/openapi.json","type":"openapi","auth_type":"bearer","key":"","enabled":true,"info":{"id":"elasticsearch","name":"Elasticsearch (audited)"},"config":{"enable":true}}]'
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - llama-server
      - mcpo
    restart: unless-stopped

volumes:
  open-webui-data:
  llm-queue-data:
